name: thermal_printer_utility
description: "A RawBT-like thermal printer driver and utility app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image: ^4.1.7               # Image rasterization, dithering & Urdu bitmap processing
  shelf: ^1.4.1               # Lightweight local HTTP server (Port 40213)
  shelf_router: ^1.1.4        # API routing for local POS integration
  qr_flutter: ^4.1.0          # QR code generation
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
